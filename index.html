<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amecly — Clips • Memes • Moments</title>
<meta name="description" content="Link hub resmi Amecly. Clips, memes, moments. Tonton di YouTube dan TikTok.">
<meta name="theme-color" content="#1A1A1F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231A1A1F'/%3E%3Cpath d='M50 14 78 84H64l-5-13H41l-5 13H22z' fill='%23F5F5F7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --violet:#8A2BE2; --pink:#FF2D95; --cyan:#00E0FF; --white:#F5F5F7; --ink:#1A1A1F;
  --bg:#0c0814;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--white);
  font-family:"Inter",system-ui,sans-serif;
  display:flex;justify-content:center;
  padding:max(28px,env(safe-area-inset-top)) 18px max(40px,env(safe-area-inset-bottom));
  position:relative;overflow-x:hidden;
}
/* slashes seperti banner */
body::before,body::after{
  content:"";position:fixed;pointer-events:none;z-index:0;
  background:linear-gradient(115deg,transparent 35%,var(--violet) 50%,transparent 65%);
  opacity:.45;filter:blur(2px);
}
body::before{width:140%;height:90px;top:-10px;left:-20%;transform:rotate(-12deg)}
body::after{width:140%;height:70px;bottom:40px;left:-20%;transform:rotate(-12deg);
  background:linear-gradient(115deg,transparent 35%,var(--pink) 50%,transparent 65%);opacity:.3}
main{position:relative;z-index:1;width:100%;max-width:460px;text-align:center}

.avatar{
  width:132px;height:132px;margin:8px auto 18px;position:relative;display:grid;place-items:center;
}
.avatar::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:4px solid transparent;
  background:conic-gradient(from 200deg,var(--violet),var(--pink),var(--violet) 60%,transparent 62%,var(--violet)) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  box-shadow:0 0 38px rgba(138,43,226,.55);
}
.avatar svg{width:78px;height:78px;overflow:visible}

.crown{width:44px;margin:0 auto -2px;display:block;opacity:.95}
h1{
  font-family:"Permanent Marker",cursive;font-weight:400;
  font-size:clamp(3.6rem,19vw,5.4rem);line-height:1;letter-spacing:.01em;
  transform:skewX(-9deg) rotate(-2deg);
  background:linear-gradient(180deg,#fff 40%,#cdb8ff 75%,var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(3px 4px 0 rgba(138,43,226,.75)) drop-shadow(0 0 22px rgba(138,43,226,.5));
  padding-right:.12em;
}
.tagline{
  margin-top:10px;font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;
  font-size:1.35rem;letter-spacing:.04em;color:var(--white);
}
.tagline i{font-style:normal;color:var(--pink);padding:0 .35em}
.sub{margin-top:6px;font-size:.85rem;color:#b9aed0;font-weight:500}

.links{display:grid;gap:14px;margin-top:34px}
.link{
  --c:var(--violet);
  display:flex;align-items:center;gap:14px;text-align:left;
  padding:16px 18px;border-radius:14px;text-decoration:none;color:var(--white);
  background:linear-gradient(100deg,rgba(26,26,31,.95),rgba(26,26,31,.8));
  border:2px solid var(--c);
  box-shadow:5px 5px 0 var(--c);
  transition:transform .15s,box-shadow .15s;
}
.link:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--c)}
.link:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--c)}
.link:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
.link.yt{--c:var(--violet)}
.link.tt{--c:var(--pink)}
.ico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--c)}
.ico svg{width:24px;height:24px;fill:#fff}
.txt{flex:1;min-width:0}
.txt b{display:block;font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;font-size:1.6rem;line-height:1.05}
.txt span{font-size:.8rem;color:#b9aed0}
.go{font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;font-size:1rem;
  background:var(--cyan);color:var(--ink);padding:6px 12px;border-radius:8px;transform:skewX(-8deg)}

.sub-cta{
  display:inline-block;margin-top:30px;padding:10px 18px;
  background:var(--white);color:var(--ink);
  font-family:"Permanent Marker",cursive;font-size:1.05rem;line-height:1.1;
  transform:rotate(-3deg);border-radius:4px;box-shadow:4px 4px 0 var(--violet);
}
footer{margin-top:34px;font-size:.75rem;color:#7d7295}

@media (prefers-reduced-motion:no-preference){
  h1{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{opacity:0;transform:skewX(-9deg) rotate(-2deg) scale(.7)}}
}
</style>
</head>
<body>
<main>
  <div class="avatar" aria-hidden="true">

      <path d="M8 70 40 56 30 74z" fill="#8A2BE2"/>

  <div class="sub-cta">SUBSCRIBE<br>FOR MORE!</div>
  <footer>© <span id="y">2026</span> Amecly</footer>
</main>

</body>
</html>
